openapi: "3.1.0"
info:
  title: Dorm Snack Marketplace – Ratings API
  version: "1.0"

paths:
  /ratings:
    post:
      summary: Submit a rating
      description: |
        Either buyer or seller may submit one rating per completed order.
        The ratee is inferred from the caller's role on the order.
        FR-012.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, stars]
              properties:
                order_id:
                  type: string
                  format: uuid
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "409":
          description: Rating already submitted for this order by this user
        "422":
          description: |
            Validation error:
            - Order is not in completed status
            - Caller is not a party to the order

  /users/{id}/ratings:
    get:
      summary: Get ratings received by a user
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  avg_rating:
                    type: number
                    nullable: true
                    description: Current average; null if no ratings yet
                  total_count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rating"
                  next_cursor:
                    type: string
                    nullable: true

components:
  schemas:
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        rater:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        stars:
          type: integer
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
