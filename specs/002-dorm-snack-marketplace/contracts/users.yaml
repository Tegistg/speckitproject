openapi: "3.1.0"
info:
  title: Dorm Snack Marketplace – Users API
  version: "1.0"

paths:
  /users/me:
    get:
      summary: Get my profile
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

    patch:
      summary: Update my profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                expo_push_token:
                  type: string
                  description: Updated on each app launch to keep push routing current
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "422":
          description: Validation error

  /users/me/avatar:
    post:
      summary: Upload or replace avatar photo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "413":
          description: File too large (max 5 MB)

  /users/me/stripe/onboard:
    post:
      summary: Begin Stripe Connect Express onboarding for seller payouts
      description: Returns a Stripe-hosted onboarding URL. Seller must complete it before receiving Stripe payouts.
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboarding_url:
                    type: string
                    format: uri

  /users/{id}:
    get:
      summary: Get a user's public profile
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "404":
          description: User not found

  /users/{id}/listings:
    get:
      summary: Get a user's active listings
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ListingCard"
                  next_cursor:
                    type: string
                    nullable: true

components:
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        avg_rating:
          type: number
          nullable: true
        completed_transaction_count:
          type: integer
        stripe_onboarding_complete:
          type: boolean
        created_at:
          type: string
          format: date-time

    PublicUserProfile:
      type: object
      description: Profile visible to other users (excludes email and Stripe details)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        avg_rating:
          type: number
          nullable: true
        completed_transaction_count:
          type: integer

    ListingCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        price_cents:
          type: integer
        category:
          type: string
        status:
          type: string
        photo_url:
          type: string
          nullable: true

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
